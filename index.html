<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ร้านไก่ทอดโซลซอส</title>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffeaf4;
      color: #444;
    }

    header {
      background-color: #ffcde1;
      text-align: center;
      padding: 20px;
      border-bottom: 4px dashed #f88dbd;
    }

    header img {
      width: 120px;
      border-radius: 50%;
    }

    h1 {
      font-size: 2em;
      margin: 10px 0 5px;
      color: #d63384;
    }

    .promo {
      font-size: 1em;
      color: #d63384;
      background-color: #ffe0f0;
      padding: 10px;
      border-radius: 10px;
      margin: 10px auto;
      width: fit-content;
    }

    .menu-section {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 30px;
    }

    .menu-item {
      background-color: #fff0f7;
      border: 2px solid #ffcde1;
      border-radius: 20px;
      width: 250px;
      padding: 15px;
      text-align: center;
      box-shadow: 4px 4px 8px rgba(255, 140, 180, 0.3);
    }

    .menu-item img {
      width: 100%;
      border-radius: 15px;
    }

    .menu-item h2 {
      margin: 10px 0 5px;
      color: #cc2c74;
    }

    .menu-item p {
      font-size: 1.1em;
      color: #d63384;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      background-color: #ffe0f0;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://i.imgur.com/pinkchickenlogo.png" alt="โลโก้ร้านไก่ทอด">
    <h1>ร้านไก่ทอดโซลซอส</h1>
    <div class="promo">🎓 พิเศษ! นักศึกษามช. แสดงบัตรนักศึกษา รับส่วนลด 10% ทุกเมนู!</div>
  </header>

  <section class="menu-section">
    <div class="menu-item">
      <img src="https://i.imgur.com/jhFzQOQ.jpg" alt="ไก่ทอดรสเผ็ดเกาหลี">
      <h2>ไก่ทอดเผ็ดเกาหลี</h2>
      <p>ราคา 129 บาท</p>
    </div>
    <div class="menu-item">
      <img src="https://i.imgur.com/Iq5Y0ZK.jpg" alt="ไก่ทอดซอสกระเทียมหอม">
      <h2>ไก่ทอดซอสกระเทียม</h2>
      <p>ราคา 119 บาท</p>
    </div>
    <div class="menu-item">
      <img src="https://i.imgur.com/VjzFzHP.jpg" alt="ไก่ทอดชีสยืด">
      <h2>ไก่ทอดชีสยืด</h2>
      <p>ราคา 139 บาท</p>
    </div>
  </section>

  <footer>
    &copy; 2025 ร้านไก่ทอดโซลซอส | หน้า มช. | โทร 098-xxx-xxxx
  </footer>

</body>
</html>
